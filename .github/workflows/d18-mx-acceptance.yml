name: D18.MX acceptance regressions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mass-exchange-and-imex:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite:
          - TEST_MASS_EXCHANGE
          - TEST_IMEX_STAGES
          - TEST_STATE_CONVERSION
    steps:
      - name: Checkout revision
        uses: actions/checkout@v4
      - name: Install numerical dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libnetcdff-dev libnetcdf-dev liblapack-dev libblas-dev pkg-config python3-numpy
      - name: Record revision and compiler
        run: |
          echo "Commit: $GITHUB_SHA"
          gfortran --version
          nf-config --version
      - name: Execute existing full regression suite
        shell: bash
        run: |
          set -o pipefail
          sh "TESTS/${{ matrix.suite }}/run_test.sh" 2>&1 | tee "d18-mx-${{ matrix.suite }}.log"
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d18-mx-${{ matrix.suite }}-${{ github.run_id }}
          path: d18-mx-*.log
          if-no-files-found: warn
