name: Solver integration and OpenMP validation

on:
  workflow_dispatch:
    inputs:
      compare_openmp:
        description: 'Also compare complete solver outputs with 1, 2 and 4 OpenMP threads'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  integration:
    name: gfortran / ${{ matrix.profile }} / integration
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: optimized
            threads: '4'
          - profile: strict-debug
            threads: '1'
    env:
      FC: gfortran
      OMP_NUM_THREADS: ${{ matrix.threads }}
      OMP_DYNAMIC: 'FALSE'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and test dependencies
        run: |
          bash .github/scripts/install-ubuntu-deps.sh \
            autoconf automake gfortran make liblapack-dev libnetcdff-dev \
            python3-numpy unzip
      - name: Configure and compile
        shell: bash
        run: |
          set -euo pipefail
          autoreconf -fi
          if [[ "${{ matrix.profile }}" == "strict-debug" ]]; then
            ./configure --with-netcdf=/usr --enable-strict-debug
          else
            ./configure --with-netcdf=/usr
          fi
          make -j4
          test -x src/IMEX_SfloW2D
      - name: Run integration test suite
        run: make check
      - name: Verify binary and stochastic restarts
        shell: bash
        run: |
          set -euo pipefail
          sh TESTS/TEST_BINARY_RESTART/run_test.sh src/IMEX_SfloW2D
          sh TESTS/TEST_STOCHASTIC_RESTART/run_test.sh src/IMEX_SfloW2D
      - name: Verify source mass budgets and HP-PCCU Gate H
        shell: bash
        env:
          IMEX_AUDIT_FORCE_THREADS: ${{ matrix.threads }}
        run: |
          set -euo pipefail
          sh TESTS/TEST_SOURCE_MASS/run_test.sh src/IMEX_SfloW2D
          sh TESTS/TEST_PCCU_GATE_H/run_test.sh src/IMEX_SfloW2D

  openmp-comparison:
    name: End-to-end OpenMP comparison (1, 2, 4 threads)
    if: ${{ inputs.compare_openmp }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FC: gfortran
      OMP_DYNAMIC: 'FALSE'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install build and Python dependencies
        run: |
          bash .github/scripts/install-ubuntu-deps.sh \
            autoconf automake gfortran make liblapack-dev libnetcdff-dev \
            python3-numpy python3-netcdf4
      - name: Build debug solver
        run: |
          set -euo pipefail
          autoreconf -fi
          ./configure --with-netcdf=/usr --enable-strict-debug
          make -j4
      - name: Compare complete solver results across thread counts
        run: |
          /usr/bin/python3 TESTS/TEST_LIE_OPENMP_END_TO_END/compare_threads.py \
            --repo "$GITHUB_WORKSPACE" \
            --solver "$GITHUB_WORKSPACE/src/IMEX_SfloW2D" \
            --evidence "$GITHUB_WORKSPACE/evidence"
      - name: Upload OpenMP comparison results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openmp-comparison-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
