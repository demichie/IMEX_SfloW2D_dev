name: D17 example input and generator audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  example-static-contract:
    name: ${{ matrix.example }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        example:
          - EXAMPLE_2D
          - EXAMPLE_2D_PP
          - EXAMPLE_BOX
          - EXAMPLE_BUMP/SUBCRITICAL
          - EXAMPLE_BUMP/SUPERCRITICAL
          - EXAMPLE_BUMP/TRANSCRITICAL_WITHOUT_SHOCK
          - EXAMPLE_BUMP/TRANSCRITICAL_WITH_SHOCK
          - EXAMPLE_BW
          - EXAMPLE_BW2D
          - EXAMPLE_CF
          - EXAMPLE_DAMBREAK
          - EXAMPLE_ENGWELL2016
          - EXAMPLE_ETNA
          - EXAMPLE_ETNA_LAVA
          - EXAMPLE_INCLINED_EXCAVATION_2D
          - EXAMPLE_LATERAL_SOURCE
          - EXAMPLE_SLOPE
          - EXAMPLE_TAAL
          - EXAMPLE_TAAL_BOTTOM
    steps:
      - uses: actions/checkout@v4
      - name: Inspect example input and generator contracts
        shell: bash
        run: |
          set -o pipefail
          mkdir -p evidence
          python3 tools/d17/audit_example_inputs.py --case "${{ matrix.example }}" --output evidence/result.json > evidence/audit.log 2>&1
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d17-example-${{ strategy.job-index }}-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
