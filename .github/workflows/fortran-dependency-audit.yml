name: Fortran architecture dependency audit

on:
  pull_request:
    paths:
      - "src/**"
      - ".github/scripts/check_fortran_dependencies.py"
      - ".github/workflows/fortran-dependency-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify Fortran source architecture and Makefile prerequisites
        run: python3 .github/scripts/check_fortran_dependencies.py
