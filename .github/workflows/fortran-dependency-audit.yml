name: Fortran architecture dependency audit

on:
  pull_request:
    paths:
      - "src/**"
      - ".github/scripts/check_fortran_dependencies.py"
      - ".github/workflows/fortran-dependency-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify Fortran source architecture and Makefile prerequisites
        run: python3 .github/scripts/check_fortran_dependencies.py

  parallel-build:
    name: Parallel gfortran build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          bash .github/scripts/install-ubuntu-deps.sh \
            autoconf automake gfortran make \
            liblapack-dev libnetcdff-dev libnetcdf-dev
      - name: Configure and build in parallel
        shell: bash
        env:
          FC: gfortran
        run: |
          set -euo pipefail
          autoreconf -fi
          ./configure --with-netcdf=/usr
          make -j4 2>&1 | tee parallel-build.log
          test -x src/IMEX_SfloW2D
      - name: Upload parallel build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fortran-audit-parallel-build
          path: parallel-build.log
          if-no-files-found: warn
