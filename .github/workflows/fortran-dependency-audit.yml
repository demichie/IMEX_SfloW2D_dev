name: Static source and documentation audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Fortran dependencies, style and source contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify source dependencies and module boundaries
        run: python3 .github/scripts/check_fortran_dependencies.py
      - name: Verify mandatory Fortran formatting and Doxygen contracts
        run: sh TESTS/TEST_SOURCE_DOCUMENTATION/run_test.sh
      - name: Verify source registry interfaces
        run: python3 TESTS/ACCEPTANCE/test_d17_physical_interfaces.py
      - name: Verify state-index and source-finalization contracts
        run: |
          python3 TESTS/ACCEPTANCE/test_state_index_contract.py
          python3 tools/d17/check_canonical_indices.py
          python3 TESTS/ACCEPTANCE/test_d17_state_finalization.py
          python3 TESTS/TEST_STATE/check_legacy_boundary.py
