name: Static source and documentation audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Fortran dependencies, style and source contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Execute every independent static audit and report all failures
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          run_check() {
            echo "::group::$*"
            if "$@"; then
              echo "PASS: $*"
            else
              echo "FAIL: $*"
              failed=1
            fi
            echo "::endgroup::"
          }
          run_check python3 -m py_compile \
            .github/scripts/check_fortran_dependencies.py \
            tools/docs/check_fortran_style.py \
            TESTS/TEST_SOURCE_DOCUMENTATION/check_documentation.py \
            TESTS/ACCEPTANCE/test_d17_physical_interfaces.py \
            TESTS/ACCEPTANCE/test_d17_state_finalization.py \
            TESTS/ACCEPTANCE/test_state_index_contract.py \
            TESTS/TEST_STATE/check_legacy_boundary.py \
            tools/d17/check_canonical_indices.py
          run_check python3 .github/scripts/check_fortran_dependencies.py
          run_check sh TESTS/TEST_SOURCE_DOCUMENTATION/run_test.sh
          run_check python3 TESTS/ACCEPTANCE/test_d17_physical_interfaces.py
          run_check python3 TESTS/ACCEPTANCE/test_state_index_contract.py
          run_check python3 tools/d17/check_canonical_indices.py
          run_check python3 TESTS/ACCEPTANCE/test_d17_state_finalization.py
          run_check python3 TESTS/TEST_STATE/check_legacy_boundary.py
          exit "$failed"
