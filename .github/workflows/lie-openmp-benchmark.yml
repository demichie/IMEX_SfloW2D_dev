name: Lie OpenMP performance benchmark

on:
  workflow_dispatch:
    inputs:
      grid_cells_x:
        description: "Grid cells in x (32 is D20 reference); y scales with x"
        required: true
        type: choice
        default: "32"
        options: ["32", "96", "192"]
      horizon:
        description: "Simulation end time in seconds"
        required: true
        type: choice
        default: "0.02"
        options: ["0.02", "0.05", "0.1"]
      cfl:
        description: "Explicit CFL (0.06 conservative; 0.24 example default)"
        required: true
        type: choice
        default: "0.06"
        options: ["0.06", "0.12", "0.24"]
      repetitions:
        description: "Timed repetitions per thread count"
        required: true
        type: choice
        default: "3"
        options: ["3", "5"]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install build and benchmark dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake gfortran make liblapack-dev libblas-dev libnetcdff-dev libnetcdf-dev python3-numpy python3-netcdf4
      - name: Build optimized production executable
        env:
          FC: gfortran
        run: |
          set -euo pipefail
          autoreconf -fi
          ./configure --with-netcdf=/usr
          make -j2
          test -x src/IMEX_SfloW2D
      - name: PCCU donor regression test
        run: sh TESTS/TEST_PCCU/run_test.sh
      - name: Validate benchmark Python syntax
        run: |
          /usr/bin/python3 -m py_compile TESTS/TEST_LIE_OPENMP_BENCHMARK/run_benchmark.py
          /usr/bin/python3 -m py_compile TESTS/TEST_LIE_OPENMP_END_TO_END/compare_threads.py
      - name: Inspect effective runner CPU resources
        run: |
          mkdir -p benchmark-results
          /usr/bin/python3 TESTS/TEST_LIE_OPENMP_BENCHMARK/inspect_cpu.py \
            --json benchmark-results/cpu-resources.json \
            --markdown benchmark-results/cpu-resources.md
          cat benchmark-results/cpu-resources.md >> "$GITHUB_STEP_SUMMARY"
      - name: Measure wall-clock OpenMP scaling
        env:
          IMEX_PROFILE_LIE: "1"
          OMP_DYNAMIC: "FALSE"
          OMP_PROC_BIND: "CLOSE"
          OMP_PLACES: "cores"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          BLIS_NUM_THREADS: "1"
          PYTHON: /usr/bin/python3
        run: |
          /usr/bin/python3 TESTS/TEST_LIE_OPENMP_BENCHMARK/run_benchmark.py \
            --repo "$GITHUB_WORKSPACE" \
            --solver "$GITHUB_WORKSPACE/src/IMEX_SfloW2D" \
            --evidence "$GITHUB_WORKSPACE/benchmark-results" \
            --cells "${{ inputs.grid_cells_x }}" \
            --horizon "${{ inputs.horizon }}" \
            --repetitions "${{ inputs.repetitions }}" \
            --cfl "${{ inputs.cfl }}"
      - name: Publish benchmark summary
        if: always()
        run: |
          if test -f benchmark-results/summary.md; then
            cat benchmark-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Archive timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lie-openmp-benchmark-${{ github.run_id }}
          path: benchmark-results/
          retention-days: 30
          if-no-files-found: warn
