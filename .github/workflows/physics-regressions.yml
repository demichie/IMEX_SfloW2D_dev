name: Cell physics and numerical regressions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regressions:
    name: ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        group: [state, physical-sources, spatial]
    env:
      FC: gfortran
      PYTHON: /usr/bin/python3
      OMP_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install test toolchain
        run: |
          bash .github/scripts/install-ubuntu-deps.sh \
            gfortran libnetcdff-dev libnetcdf-dev liblapack-dev libblas-dev \
            pkg-config python3-numpy
      - name: Run current regression suites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          case "${{ matrix.group }}" in
            state)
              suites="TEST_MODEL_LAYOUT TEST_LAYER_PHYSICS TEST_STATE TEST_WORKSPACE_LIFECYCLE"
              ;;
            physical-sources)
              suites="TEST_SOURCE_REGISTRY TEST_MASS_EXCHANGE TEST_CURVATURE_SOURCE TEST_RHEOLOGY_FROUDE TEST_RHEOLOGY_CELL_LOCAL TEST_STOCHASTIC_EVOLUTION"
              ;;
            spatial)
              suites="TEST_SPATIAL_OPERATOR TEST_PCCU TEST_HP_RECONSTRUCTION"
              ;;
          esac
          for suite in $suites; do
            echo "::group::$suite"
            sh "TESTS/$suite/run_test.sh" > "evidence/$suite.log" 2>&1 || {
              cat "evidence/$suite.log"
              exit 1
            }
            tail -n 20 "evidence/$suite.log"
            echo "::endgroup::"
          done
      - name: Upload regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ matrix.group }}-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
