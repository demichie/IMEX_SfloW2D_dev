name: Publish Docker image to GHCR

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: publish-ghcr
  cancel-in-progress: false

jobs:
  build-and-push-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout selected master commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Normalize GHCR image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Configure Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate immutable and moving image tags
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=sha-
          labels: |
            org.opencontainers.image.title=IMEX-SfloW2D
            org.opencontainers.image.description=Depth-averaged geophysical flow solver
            org.opencontainers.image.licenses=GPL-3.0-only

      - name: Build runtime image (publish only on master)
        id: push
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/master' }}
          load: ${{ github.ref != 'refs/heads/master' }}
          build-args: |
            BUILD_PROFILE=optimized
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the locally loaded runtime image
        if: github.ref != 'refs/heads/master'
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/sh "$IMAGE:sha-$GITHUB_SHA" -ec \
            'test -x /usr/local/bin/IMEX_SfloW2D && ! ldd /usr/local/bin/IMEX_SfloW2D | grep -q "not found"'

      - name: Attest published image
        if: github.ref == 'refs/heads/master'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summarize publication
        if: github.ref == 'refs/heads/master'
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "## Published container"
            echo ""
            echo "Image: \`$IMAGE\`"
            echo "Digest: \`$DIGEST\`"
            echo ""
            echo "Tags:"
            printf '%s\n' "$TAGS"
            echo ""
            echo "Confirm GitHub Package visibility before advertising anonymous pulls."
          } >> "$GITHUB_STEP_SUMMARY"
