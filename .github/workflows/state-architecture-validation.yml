name: State architecture validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  state-new:
    name: New state architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify stateNEW production boundary
        shell: bash
        run: python3 TESTS/TEST_STATE/check_legacy_boundary.py

      - name: Install Fortran test dependencies
        run: |
          bash .github/scripts/install-ubuntu-deps.sh gfortran

      - name: Compile and run TEST_STATE
        shell: bash
        run: |
          set -euo pipefail
          sh TESTS/TEST_STATE/run_test.sh 2>&1 | tee state-new-test.log

      - name: Upload state architecture log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-new-test-${{ github.run_id }}
          path: state-new-test.log
          if-no-files-found: warn

  existing-state-regressions:
    name: Existing state regression / ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        suite:
          - TEST_STATE_CONVERSION
          - TEST_MASS_EXCHANGE
          - TEST_SPATIAL_OPERATOR
          - TEST_WORKSPACE_LIFECYCLE
          - TEST_RHEOLOGY_CELL_LOCAL
          - TEST_RHEOLOGY_FROUDE
          - TEST_SOURCE_REGISTRY
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install regression dependencies
        run: |
          bash .github/scripts/install-ubuntu-deps.sh \
            gfortran libnetcdff-dev libnetcdf-dev \
            liblapack-dev libblas-dev pkg-config python3-numpy

      - name: Run existing regression suite
        shell: bash
        env:
          OMP_NUM_THREADS: '1'
          OMP_DYNAMIC: 'FALSE'
          PYTHON: /usr/bin/python3
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf 'commit=%s\nsuite=%s\n' "$GITHUB_SHA" "${{ matrix.suite }}" > evidence/context.txt
          sh "TESTS/${{ matrix.suite }}/run_test.sh" 2>&1 | tee evidence/run.log

      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-regression-${{ matrix.suite }}-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn

  state-equivalence:
    name: Old/new state equivalence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install equivalence-test dependencies
        run: |
          bash .github/scripts/install-ubuntu-deps.sh gfortran libnetcdff-dev libnetcdf-dev liblapack-dev libblas-dev pkg-config
      - name: Compare legacy and state backends
        shell: bash
        run: |
          set -euo pipefail
          sh TESTS/TEST_STATE_EQUIVALENCE/run_test.sh 2>&1 | tee state-equivalence.log
      - name: Upload equivalence log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-equivalence-${{ github.run_id }}
          path: state-equivalence.log
          if-no-files-found: warn

  strict-debug-driver:
    name: Full driver strict-debug build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install full build dependencies
        run: |
          bash .github/scripts/install-ubuntu-deps.sh \
            autoconf automake gfortran make \
            liblapack-dev libnetcdff-dev libnetcdf-dev

      - name: Build complete executable with checks
        shell: bash
        run: |
          set -euo pipefail
          autoreconf -fi
          FC=gfortran ./configure --with-netcdf=/usr --enable-strict-debug
          make -j2 2>&1 | tee full-strict-debug-build.log
          test -x src/IMEX_SfloW2D

      - name: Report compiler error in build log
        if: failure()
        shell: bash
        run: |
          if [ -f full-strict-debug-build.log ]; then
            first=$(grep -m1 -E 'Error:|Fatal Error:|error:' full-strict-debug-build.log || true)
            if [ -n "$first" ]; then
              echo "::error title=Fortran compiler failure::$first"
            fi
          fi

      - name: Reproduce Taal settling through first time steps
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke-taal
          cp EXAMPLES/EXAMPLE_TAAL/IMEX_SfloW2D.inp smoke-taal/IMEX_SfloW2D.inp
          ln -s "$GITHUB_WORKSPACE/EXAMPLES/EXAMPLE_TAAL/topography_dem.asc" smoke-taal/topography_dem.asc
          sed -i -E 's/^ T_END=.*/ T_END= 0.3500000000,/' smoke-taal/IMEX_SfloW2D.inp
          grep -E 'SETTLING_FLAG *= *T' smoke-taal/IMEX_SfloW2D.inp
          (
            cd smoke-taal
            OMP_NUM_THREADS=2 OMP_DYNAMIC=FALSE IMEX_LIE_DIAGNOSTICS=1 \
              timeout 240s "$GITHUB_WORKSPACE/src/IMEX_SfloW2D" 2>&1 | tee ../taal-settling-smoke.log
          )
          grep -q 't = ' taal-settling-smoke.log
          ! grep -q 'D19:' taal-settling-smoke.log
          # A zero-mass run is a false positive: settling was never exercised.
          # Require BOTH injected flow and transported solid mass in the log.
          awk '
            /^t =/ {
              for (i=1; i<=NF; i++) {
                if ($i=="mass" && $(i+1)=="=" && $(i+2)+0>0) wet=1
                if ($i=="solid" && $(i+1)=="mass" && $(i+2)=="=" && $(i+3)+0>0) solids=1
              }
            }
            END {
              if (!wet || !solids) {
                print "TAAL_SMOKE_INVALID: no injected flow or solids" > "/dev/stderr"
                exit 1
              }
              print "TAAL_SMOKE_ACTIVE: injected flow and solids observed"
            }
          ' taal-settling-smoke.log

      - name: Upload settling diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taal-settling-smoke-${{ github.run_id }}
          path: taal-settling-smoke.log
          if-no-files-found: warn

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-strict-debug-${{ github.run_id }}
          path: full-strict-debug-build.log
          if-no-files-found: warn

