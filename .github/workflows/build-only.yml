name: Build (optimized and debug)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Compilation profile'
        type: choice
        required: true
        default: optimized
        options:
          - optimized
          - debug

permissions:
  contents: read

jobs:
  build:
    name: gfortran / ${{ inputs.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and libraries
        run: |
          bash .github/scripts/install-ubuntu-deps.sh \
            autoconf automake gfortran make liblapack-dev libnetcdff-dev
      - name: Configure
        shell: bash
        env:
          FC: gfortran
        run: |
          set -euo pipefail
          autoreconf -fi
          if [[ "${{ inputs.profile }}" == "debug" ]]; then
            ./configure --with-netcdf=/usr --enable-strict-debug
          else
            ./configure --with-netcdf=/usr
          fi
      - name: Compile only
        shell: bash
        run: |
          set -euo pipefail
          make -j4 2>&1 | tee build.log
          test -x src/IMEX_SfloW2D
      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ inputs.profile }}-${{ github.run_id }}
          path: build.log
          if-no-files-found: warn
