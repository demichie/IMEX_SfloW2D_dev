name: Build (optimized and debug)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: gfortran / ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        profile: [optimized, strict-debug]
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and libraries
        run: |
          bash .github/scripts/install-ubuntu-deps.sh \
            autoconf automake gfortran make liblapack-dev libnetcdff-dev
      - name: Configure
        shell: bash
        env:
          FC: gfortran
        run: |
          set -euo pipefail
          autoreconf -fi
          if [[ "${{ matrix.profile }}" == "strict-debug" ]]; then
            ./configure --with-netcdf=/usr --enable-strict-debug
          else
            ./configure --with-netcdf=/usr
          fi
      - name: Compile only
        shell: bash
        run: |
          set -euo pipefail
          make -j4 2>&1 | tee build.log
          test -x src/IMEX_SfloW2D
      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.profile }}-${{ github.run_id }}
          path: build.log
          if-no-files-found: warn
