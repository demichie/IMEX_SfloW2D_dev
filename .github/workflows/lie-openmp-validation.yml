name: Lie OpenMP validation (D20)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openmp-build:
    name: OpenMP strict-debug build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and numerical libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake gfortran make liblapack-dev libnetcdff-dev libnetcdf-dev
      - name: Configure strict-debug build
        env:
          FC: gfortran
        run: |
          autoreconf -fi
          ./configure --with-netcdf=/usr --enable-strict-debug
      - name: Build complete Lie solver
        run: |
          set -o pipefail
          make -j2 2>&1 | tee d20-build.log
          test -f src/IMEX_SfloW2D
      - name: Preserve compiler output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d20-openmp-build-log
          path: d20-build.log
          if-no-files-found: warn

  openmp-regressions:
    name: "${{ matrix.suite }} / ${{ matrix.threads }} thread(s)"
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        threads: [1, 2, 4]
        suite:
          - TEST_RHEOLOGY_CELL_LOCAL
          - TEST_STATE_CONVERSION
          - TEST_MASS_EXCHANGE
          - TEST_SPATIAL_OPERATOR
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libnetcdff-dev libnetcdf-dev liblapack-dev libblas-dev pkg-config python3-numpy
      - name: Run regression with fixed thread count
        env:
          OMP_NUM_THREADS: "${{ matrix.threads }}"
          OMP_DYNAMIC: "FALSE"
          OPENBLAS_NUM_THREADS: "1"
          PYTHON: /usr/bin/python3
        shell: bash
        run: |
          set -o pipefail
          mkdir -p evidence
          echo "commit=$GITHUB_SHA" > evidence/context.txt
          echo "suite=${{ matrix.suite }}" >> evidence/context.txt
          echo "omp_threads=$OMP_NUM_THREADS" >> evidence/context.txt
          sh "TESTS/${{ matrix.suite }}/run_test.sh" 2>&1 | tee evidence/run.log
      - name: Upload thread-specific results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d20-${{ matrix.suite }}-threads-${{ matrix.threads }}
          path: evidence/
          if-no-files-found: warn

# These existing suites exercise individual numerical kernels and conversions.
# They do NOT establish whole-step Lie equivalence, race freedom or rollback
# invariants; those require further integration tests.
