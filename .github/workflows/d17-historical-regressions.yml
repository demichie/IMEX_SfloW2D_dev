name: D17 historical physics regressions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-regression:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite:
          - TEST_IMEX_STAGES
          - TEST_SPATIAL_OPERATOR
          - TEST_MASS_EXCHANGE
          - TEST_CURVATURE_SOURCE
          - TEST_RHEOLOGY_FROUDE
          - TEST_RHEOLOGY_CELL_LOCAL
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
      - name: Install test toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libnetcdff-dev libnetcdf-dev liblapack-dev libblas-dev pkg-config python3-numpy
      - name: Run existing suite (all profiles)
        shell: bash
        env:
          PYTHON: /usr/bin/python3
          OMP_DYNAMIC: 'FALSE'
        run: |
          set -o pipefail
          mkdir -p evidence
          printf 'commit=%s\nsuite=%s\n' "$GITHUB_SHA" "${{ matrix.suite }}" | tee evidence/context.txt
          sh "TESTS/${{ matrix.suite }}/run_test.sh" 2>&1 | tee evidence/test-run.log
      - name: Upload suite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d17-historical-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
